name: Demo website
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/build_demo_site.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.5'
      - run: uv sync --locked --no-editable --python 3.12
      - run: uv run --no-editable pytest
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      # This builder accepts no user-input path: only packaged synthetic fixtures are published.
      - run: uv run --no-editable python scripts/build_demo_site.py --out artifacts/public-demo
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: artifacts/public-demo/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy synthetic demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
