name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.5'
      - run: uv sync --locked --no-editable --python ${{ matrix.python }}
      - run: uv run --no-editable ruff check .
      - run: uv run --no-editable ruff format --check src tests scripts
      - run: uv run --no-editable pytest --junitxml=artifacts/tests.xml
      - run: uv run --no-editable python -m build
      - run: uv run --no-editable twine check dist/*.whl dist/*.tar.gz
      - run: uv run --no-editable python scripts/package_smoke.py --dist dist --out "$RUNNER_TEMP/pathwaybridge-smoke"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python }}
          path: |
            artifacts/tests.xml
            ${{ runner.temp }}/pathwaybridge-smoke/results.json
